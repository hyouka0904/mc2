# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Debug enables gosASSERT / Verify checks that release builds skip
        build_type: [RelWithDebInfo, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libglew-dev libgl-dev zlib1g-dev \
            libfreetype-dev fontconfig fonts-dejavu-core \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxtst-dev libxfixes-dev libxkbcommon-dev \
            libpulse-dev libasound2-dev glslang-tools spirv-tools spirv-cross python3

      # SDL3 is not packaged for Ubuntu 24.04: the configure step downloads
      # and builds the pinned releases (cmake/MC2Dependencies.cmake).

      - name: Configure
        # shader_spirv must also produce the Metal and HLSL sources
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMC2_SHADER_REQUIRE=msl,hlsl

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit and tool tests
        run: ctest --test-dir build --output-on-failure

      - name: No SDL2 / shared SDL3 left in the binaries; OpenGL only in the game
        run: |
          for b in build/mc2 build/out/text_tool/text_tool; do
            if ldd "$b" | grep -i sdl; then echo "unexpected SDL shared library in $b"; exit 1; fi
          done
          for b in build/out/data_tools/*; do
            if ldd "$b" | grep -iE 'libGL|libOpenGL|libGLEW'; then echo "unexpected OpenGL library in $b"; exit 1; fi
          done

      - name: Upload binaries
        if: matrix.build_type == 'RelWithDebInfo'
        uses: actions/upload-artifact@v4
        with:
          name: mc2-linux-build
          retention-days: 3
          path: |
            build/mc2
            build/out/res/libmc2res_64.so
            build/out/data_tools/aseconv
            build/out/data_tools/makefst
            build/out/data_tools/makersp
            build/out/data_tools/pak
            build/out/text_tool/text_tool
            build/shaders_out/

  smoke-test:
    # Builds the game data and plays the first campaign mission headless
    # (Xvfb + Mesa software rendering), with the OpenGL backend (llvmpipe)
    # and the SDL3 GPU backend (Vulkan on lavapipe, validation layers on).
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout game data
        uses: actions/checkout@v4
        with:
          repository: alariq/mc2srcdata
          path: mc2srcdata
          lfs: true

      - uses: actions/download-artifact@v4
        with:
          name: mc2-linux-build
          path: build

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglew2.2 libfreetype6 libxkbcommon0 \
            libopengl0 libgl1 libglx0 libglx-mesa0 libgl1-mesa-dri \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers \
            xvfb x11-utils imagemagick ffmpeg python3-pil python3-numpy
          chmod +x build/mc2 build/out/data_tools/* build/out/text_tool/text_tool

      - name: Build game data
        env:
          # fall back to placeholder clips if LFS bandwidth is exhausted
          MC2_PLACEHOLDER_MOVIES: "1"
        run: scripts/prepare_game_dir.sh build mc2srcdata game

      - name: Smoke test (mission mc2_01, OpenGL)
        env:
          MC2_SMOKE_OUT: smoke
          MC2_SMOKE_ARGS: -renderer gl
        run: scripts/smoke_test.sh game mc2_01 60

      - name: Smoke test (mission mc2_01, SDL3 GPU)
        env:
          MC2_SMOKE_OUT: smoke_gpu
          MC2_SMOKE_ARGS: -renderer gpu
        run: scripts/smoke_test.sh game mc2_01 60

      - name: Screenshot comparison (tests/golden, OpenGL)
        run: python3 scripts/run_screenshot_tests.py game shots

      # Same golden images: the SDL3 GPU backend differs by at most 0.25 % of
      # the pixels (rasterisation), well under the 0.5 % threshold
      - name: Screenshot comparison (tests/golden, SDL3 GPU + Vulkan validation)
        run: python3 scripts/run_screenshot_tests.py game shots_gpu --renderer gpu --gpu-validation

      - name: Upload screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-result
          path: |
            smoke/
            smoke_gpu/
            shots/
            shots_gpu/

  build-macos:
    # Apple Silicon, Metal through SDL3 GPU. No GPU on the runner for the
    # game itself: build, unit tests and the .app bundle only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install glslang spirv-tools spirv-cross freetype

      - name: Configure
        # OpenGL is off by default on macOS; shaders must include Metal
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMC2_SHADER_REQUIRE=msl

      - name: Build
        # -k: compile everything, then list every error at the end
        run: |
          set +e
          cmake --build build -j"$(sysctl -n hw.ncpu)" -- -k 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "::group::Errors"; grep -E "error:|Undefined symbols|ld: " build.log | grep -v "_deps/" | sort -u; echo "::endgroup::"
          exit $status

      - name: Unit and tool tests
        run: ctest --test-dir build --output-on-failure

      - name: Check the app bundle
        run: |
          test -x build/mc2.app/Contents/MacOS/mc2
          test -f build/mc2.app/Contents/Resources/libmc2res.dylib
          plutil -lint build/mc2.app/Contents/Info.plist
          vtool -show-build build/mc2.app/Contents/MacOS/mc2 | grep -E "minos 13\.0"
          if otool -L build/mc2.app/Contents/MacOS/mc2 | grep -iE "sdl|glew|opengl"; then
            echo "unexpected SDL / OpenGL library in mc2"; exit 1
          fi

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: mc2-macos-build
          retention-days: 3
          path: |
            build/mc2.app
            build/shaders_out/

  build-windows:
    # MSVC, x64. zlib / GLEW / FreeType from vcpkg as static libraries with
    # the dynamic CRT (the default for CMake's release configurations).
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib glew freetype --triplet x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        # build everything, then list every error at the end
        shell: bash
        run: |
          set +e
          cmake --build build --config RelWithDebInfo --parallel -- /p:ContinueOnError=ErrorAndContinue 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "::group::Errors"; grep -E "error (C|LNK)[0-9]+|fatal error" build.log | grep -v "_deps" | sort -u; echo "::endgroup::"
          if grep -qE "error (C|LNK)[0-9]+|fatal error" build.log; then exit 1; fi
          exit $status

      - name: Unit and tool tests
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: mc2-windows-build
          retention-days: 3
          path: |
            build/RelWithDebInfo/mc2.exe
            build/out/res/RelWithDebInfo/mc2res_64.dll

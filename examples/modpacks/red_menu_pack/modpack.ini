; Example modpack: both menu mods, but red wins through a priority override
[modpack]
id = red_menu_pack
name = Red menu pack
version = 1.0.0
author = MC2 port examples
description = Enables red_main_menu and blue_main_menu and lets red win.

[mods]
blue_main_menu = ^1.0
red_main_menu = ^1.0

[priority]
red_main_menu = 20
